
name: Build AML OS ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            xorriso \
            squashfs-tools

      - name: Remove Ubuntu-specific configuration
        run: |
          if [ -d config ]; then
            grep -RIl "ubuntu-keyring" config 2>/dev/null | while read -r file; do
              echo "Found ubuntu-keyring in: $file"
            done
          fi

      - name: Configure AML OS
        run: |
          mkdir -p config/package-lists
          mkdir -p config/includes.chroot/etc/skel

          cat > config/package-lists/aml-os.list.chroot <<'EOF'
          live-boot
          live-config
          sudo
          systemd
          xfce4
          xfce4-terminal
          lightdm
          network-manager
          firefox-esr
          nano
          vim
          curl
          wget
          htop
          bash-completion
          calamares
          EOF

          lb config \
            --distribution bookworm \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --debian-installer false \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap https://deb.debian.org/debian \
            --mirror-chroot https://deb.debian.org/debian \
            --mirror-binary https://deb.debian.org/debian \
            --mirror-chroot-security https://deb.debian.org/debian-security \
            --mirror-binary-security https://deb.debian.org/debian-security \
            --bootappend-live "boot=live components username=user hostname=aml-os"

      - name: Build AML OS
        run: |
          sudo lb build

      - name: List ISO
        run: |
          ls -lh *.iso

      - name: Upload AML OS ISO
        uses: actions/upload-artifact@v4
        with:
          name: AML-OS-AMD64-ISO
          path: "*.iso"
          if-no-files-found: error
