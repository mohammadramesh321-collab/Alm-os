
name: Build AML OS AMD64 ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Download AML OS source
        uses: actions/checkout@v4

      - name: Build bootable ISO
        run: |
          chmod +x build-iso.sh
          sudo ./build-iso.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: AML-OS-amd64-ISO
          path: AML-OS-amd64.iso
          if-no-files-found: error
          retention-days: 14
