
name: Build AML OS AMD64 ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Download AML OS source
        uses: actions/checkout@v4

      - name: Extract AML configuration
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p /tmp/aml-config
          unzip -q config.zip -d /tmp/aml-config

          if [ -d /tmp/aml-config/config ]; then
            cp -a /tmp/aml-config/config ./config
          else
            mkdir -p config
            cp -a /tmp/aml-config/. config/
          fi

          test -d config/includes.chroot
          test -d config/package-lists

      - name: Build bootable ISO
        run: |
          chmod +x build-iso.sh
          sudo ./build-iso.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: AML-OS-amd64-ISO
          path: AML-OS-amd64.iso
          if-no-files-found: error
          retention-days: 14
